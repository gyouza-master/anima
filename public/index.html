<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>anima - 管制塔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:#06090F; }
  body {
    color:#E6EDF7; font-family:'Zen Kaku Gothic New',-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(180deg, #070B12 0%, #06090F 55%, #05070C 100%);
    background-attachment:fixed;
  }

  /* ぼわ〜っと漂う背景グラデ（オーロラ風ブロブ） */
  .bg { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.85; will-change:transform; }
  .b1 { width:680px; height:680px; left:4%;  top:-14%;    background:radial-gradient(circle, rgba(56,189,248,.48), transparent 70%);  animation:drift1 22s ease-in-out infinite; }
  .b2 { width:600px; height:600px; right:2%; top:24%;     background:radial-gradient(circle, rgba(124,58,237,.46), transparent 70%);  animation:drift2 26s ease-in-out infinite; }
  .b3 { width:580px; height:580px; left:30%; bottom:-18%; background:radial-gradient(circle, rgba(236,72,153,.36), transparent 70%);  animation:drift3 30s ease-in-out infinite; }
  .b4 { width:460px; height:460px; left:44%; top:6%;      background:radial-gradient(circle, rgba(45,212,191,.30), transparent 70%);  animation:drift1 36s ease-in-out infinite reverse; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)}      50%{transform:translate(180px,120px) scale(1.28)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)}      50%{transform:translate(-160px,110px) scale(1.22)} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1.12)}   50%{transform:translate(140px,-130px) scale(.86)} }
  @media (prefers-reduced-motion: reduce) { .blob { animation:none !important; } }
  .mono { font-family:'IBM Plex Mono',Monaco,monospace; }

  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes pulseRing { 0%,100%{transform:scale(1);opacity:.55} 50%{transform:scale(1.14);opacity:.12} }
  @keyframes caret { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  @keyframes attnGlow { 0%,100%{box-shadow:0 0 0 1px #48381A,0 0 22px rgba(251,191,36,.10)} 50%{box-shadow:0 0 0 1px #7A5E1F,0 0 30px rgba(251,191,36,.28)} }
  @keyframes dashRun { from { stroke-dashoffset:0; } to { stroke-dashoffset:var(--dash-to); } }
  @keyframes flow { to { stroke-dashoffset:-36; } }

  .app { width:100%; min-height:100vh; display:flex; flex-direction:column; }
  .bar { display:flex; align-items:center; justify-content:space-between; padding:14px 26px; border-bottom:1px solid #161E2C; background:#0A0F1A; }
  .brand { display:flex; align-items:center; gap:11px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#38BDF8; box-shadow:0 0 12px #38BDF8; }
  .logo { font-weight:700; font-size:16px; letter-spacing:.1em; }
  .sub { font-size:11px; color:#4E5D75; }
  .actions { display:flex; align-items:center; gap:9px; }
  .conn { font-size:11px; padding:5px 11px; border-radius:999px; border:1px solid #17453A; background:#0A1B17; color:#34D399; }
  .conn.off { border-color:#4B2026; background:#1B0F12; color:#FCA5A5; }
  .btn { font-size:12px; font-weight:600; padding:7px 14px; border-radius:8px; border:none; background:#38BDF8; color:#06090F; cursor:pointer; }
  .btn:hover { filter:brightness(1.08); }
  .btn.ghost { background:transparent; border:1px solid #212B3D; color:#8494AC; font-weight:500; }
  .btn.ghost:hover { border-color:#33415C; color:#C3D0E2; }

  .strip { display:flex; align-items:center; justify-content:space-between; padding:11px 26px; border-bottom:1px solid #161E2C;
           background:linear-gradient(90deg,rgba(56,189,248,.06),transparent 60%); }
  .strip .label { font-size:11px; letter-spacing:.16em; color:#3F7EA8; }
  .counts { display:flex; gap:16px; font-size:12.5px; font-weight:600; }

  /* 両端=カード / 中央=球体 / 背後=配線 */
  .stage { position:relative; flex:1; min-height:600px; display:flex; align-items:center; justify-content:center; gap:20px; padding:30px 26px; }
  .wires { position:absolute; inset:0; pointer-events:none; z-index:0; }
  .side { display:flex; flex-direction:column; justify-content:center; gap:20px; z-index:1; }
  .center { flex:1; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; min-width:280px; }
  .glow { position:absolute; width:88%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 50% 50%, rgba(56,189,248,.12), rgba(6,9,15,0) 68%); }
  .sphere { width:min(40vw,520px); aspect-ratio:1; position:relative; z-index:1; }
  .sphere svg { width:100%; height:100%; display:block; }
  .empty-hint { color:#3F4C61; font-size:13px; text-align:center; }

  .card { position:relative; width:290px; background:#0B111C; border:1px solid #1A2231; border-radius:16px; padding:16px 15px 14px;
          display:flex; flex-direction:column; align-items:center; transition:border-color .2s; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .close { position:absolute; top:10px; right:10px; width:22px; height:22px; display:flex; align-items:center; justify-content:center;
           font-size:11px; border:1px solid #212B3D; background:#0B111C; color:#5B6B84; border-radius:7px; cursor:pointer; z-index:2; }
  .close:hover { color:#FCA5A5; border-color:#4B2026; }
  .jumpic { position:absolute; top:38px; right:10px; width:22px; height:22px; display:flex; align-items:center; justify-content:center;
            font-size:11px; border:1px solid #1E3A55; background:#0B111C; color:#93C5FD; border-radius:7px; cursor:pointer; z-index:2; }
  .jumpic:hover { color:#DBEAFE; border-color:#2E5680; }
  .card.attn { animation:attnGlow 1.6s ease-in-out infinite; border-color:#7A5E1F; }
  .avwrap { position:relative; width:72px; height:72px; }
  .av { width:72px; height:72px; display:flex; align-items:center; justify-content:center; }
  .ring { position:absolute; inset:-8px; border-radius:50%; border:2px solid #FBBF24; animation:pulseRing 1.3s ease-in-out infinite; display:none; }
  .nm { font-size:15px; font-weight:700; margin-top:6px; }
  .model { font-size:10.5px; color:#4E5D75; margin-top:1px; min-height:13px; }
  .panel { width:100%; margin-top:11px; background:#0A1220; border:1px solid #16202E; border-radius:12px; padding:11px; }
  .tk { font-size:12.5px; font-weight:500; text-align:center; cursor:pointer; padding:3px 4px; border-radius:6px; }
  .tk:hover { background:#0E1524; }
  .taskin { width:100%; font-size:13px; padding:5px 8px; border:1px solid #38BDF8; background:#0A1220; color:#E6EDF7; border-radius:6px; text-align:center; }
  .st { font-size:12px; font-weight:600; font-family:'IBM Plex Mono',monospace; text-align:center; margin-top:8px; }
  .row { display:flex; justify-content:center; gap:6px; margin-top:10px; }
  .mini { font-size:11px; border:1px solid #212B3D; background:transparent; color:#5B6B84; border-radius:7px; padding:4px 9px; cursor:pointer; }
  .mini:hover { color:#C3D0E2; border-color:#33415C; }
  .mini.jump { color:#93C5FD; border-color:#1E3A55; }
  .mini.jump:hover { color:#DBEAFE; border-color:#2E5680; }

  .notice { width:100%; margin-top:10px; border-radius:10px; padding:11px; text-align:left; }
  .notice.appr { background:#12111A; border:1px solid #48381A; }
  .notice.inp  { background:#0B1523; border:1px solid #1E3A55; }
  .notice.done { background:#141105; border:1px solid #6B520F; }
  .notice h4 { font-size:12px; font-weight:700; margin-bottom:8px; }
  .notice.appr h4 { color:#FBBF24; } .notice.inp h4 { color:#93C5FD; } .notice.done h4 { color:#FCD34D; }
  .cmd { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#E8C583; background:#1A1710;
         border-radius:7px; padding:8px 9px; margin-bottom:9px; word-break:break-all; max-height:52px; overflow:hidden; }
  .bb { display:flex; gap:7px; }
  .allow { flex:1; font-size:12px; font-weight:700; border:none; border-radius:7px; padding:8px; background:#34D399; color:#06251B; cursor:pointer; }
  .deny  { flex:1; font-size:12px; font-weight:700; border:1px solid #4B2026; border-radius:7px; padding:7px; background:#2A1417; color:#FCA5A5; cursor:pointer; }
  .more  { display:block; width:100%; margin-top:7px; background:none; border:none; color:#8494AC; font-size:11px; cursor:pointer; }
  .more:hover { color:#C3D0E2; }

  .lounge { padding:22px 26px 26px; border-top:1px solid #161E2C; background:#080C14; }
  .lounge > .label { font-size:11px; letter-spacing:.16em; color:#3F7EA8; margin-bottom:16px; }
  .lounge-row { display:flex; flex-wrap:wrap; gap:26px; }
  .rest { display:flex; flex-direction:column; align-items:center; gap:5px; width:96px; }
  .rest .rav { width:58px; height:58px; display:flex; align-items:center; justify-content:center; opacity:.5; }
  .rest .rnm { font-size:12px; color:#5B6B84; font-weight:600; }
  .rest .rst { font-size:10px; color:#3F4C61; }

  .queue { display:flex; align-items:center; gap:14px; padding:13px 26px; border-top:1px solid #161E2C; background:#0A0F1A; }
  .queue .label { font-size:11px; letter-spacing:.08em; color:#4E5D75; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8494AC; background:#101724; border:1px solid #1C2536; padding:5px 11px; border-radius:999px; }

  .modal { display:none; position:fixed; inset:0; background:rgba(3,6,12,.72); z-index:1000; align-items:center; justify-content:center; }
  .modal.open { display:flex; }
  .sheet { width:90%; max-width:540px; max-height:80vh; overflow-y:auto; background:#0B111C; border:1px solid #1E2739;
           border-radius:16px; padding:24px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .sheet h2 { font-size:17px; font-weight:700; }
  .sheet .hint { font-size:11px; color:#5B6B84; margin:10px 0 8px; }
  .item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px;
          border:1px solid #1C2536; border-radius:10px; margin-bottom:8px; background:#0A1220; }
  .item .p { font-size:13px; font-weight:700; }
  .item .m { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#4E5D75; }
  .drow { margin-bottom:12px; }
  .dlabel { font-size:11px; color:#4E5D75; margin-bottom:4px; }
  .dval { font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#C3D0E2; background:#0A1220;
          border:1px solid #18202E; border-radius:8px; padding:8px 10px; word-break:break-all; white-space:pre-wrap; }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>

<div class="app">
  <div class="bar">
    <div class="brand">
      <div class="dot"></div>
      <div class="logo">anima</div>
      <div class="sub mono">管制塔 · localhost:4317</div>
    </div>
    <div class="actions">
      <div class="conn off mono" id="conn">接続なし</div>
      <button class="btn" onclick="openConnect()">＋ 接続</button>
      <button class="btn ghost" onclick="clearAll()">全クリア</button>
    </div>
  </div>

  <div class="strip">
    <div style="display:flex;align-items:center;gap:18px;">
      <div class="label mono">ANIMA CORE</div>
      <div class="counts mono" id="counts"></div>
    </div>
    <div class="mono" style="font-size:11px;color:#4E5D75;" id="clock"></div>
  </div>

  <div class="stage" id="stage">
    <svg class="wires" id="wires"></svg>
    <div class="side" id="leftSide"></div>
    <div class="center">
      <div class="glow"></div>
      <div class="sphere" id="sphere"></div>
      <div class="empty-hint" id="emptyHint" style="display:none;position:absolute;">「＋ 接続」から AI を追加</div>
    </div>
    <div class="side" id="rightSide"></div>
  </div>

  <div class="lounge">
    <div class="label">待機室</div>
    <div class="lounge-row" id="lounge"></div>
  </div>

  <div class="queue">
    <div class="label">待機キュー</div>
    <div class="chips" id="queue"><div class="chip">空</div></div>
  </div>
</div>

<div class="modal" id="connectModal">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2>稼働中の AI を選択</h2>
      <button class="btn ghost" onclick="refreshDiscover()">🔄 更新</button>
    </div>
    <div class="hint">ネイティブ（Claude Code等）はライブ連携、ブラウザのAIは存在表示＋生成検知。</div>
    <div id="discoverList"></div>
    <button class="btn ghost" style="width:100%;padding:11px;margin-top:6px;" onclick="closeConnect()">閉じる</button>
  </div>
</div>

<div class="modal" id="detailModal">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 id="detailTitle">判断内容の詳細</h2>
      <button class="btn ghost" onclick="closeDetail()">✕ 閉じる</button>
    </div>
    <div id="detailBody"></div>
    <div class="bb" style="margin-top:18px;" id="detailActions"></div>
  </div>
</div>

<script src="/avatar.js"></script>
<script>
const API = '';
const WS_URL = `ws://${location.hostname}:${location.port || 4317}/ws`;
const NSVG = 'http://www.w3.org/2000/svg';
const STATUS = {
  'working':           { label:'● 動作中',  color:'#34D399', av:'working' },
  'awaiting-approval': { label:'◉ 判断待ち', color:'#FBBF24', av:'waiting' },
  'awaiting-input':    { label:'◐ 入力待ち', color:'#60A5FA', av:'waiting' },
  'idle':              { label:'○ 返信待ち', color:'#5B6B84', av:'idle' },
  'done':              { label:'○ 完了',    color:'#5B6B84', av:'done' },
  'error':             { label:'× エラー',  color:'#FCA5A5', av:'error' }
};

let state = { sessions:{}, queue:[], pendingApprovals:{}, roster:[] };
let ws = null, editingTask = null, discovered = [];
const cardEls = {}, lastAvatar = {}, cardSide = {};
let lastWireSig = '', lastBeamSig = '';

const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const el = (tag, cls, css) => { const n = document.createElement(tag); if (cls) n.className = cls; if (css) n.style.cssText = css; return n; };
function fmt(ms) { if (!ms || ms < 0) return '0:00'; const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function rosterOf(id) {
  return (state.roster || []).find(r => r.id === id) ||
    { id, name:`スロット ${id}`, color:'#4E5D75', body:'slim', deco:'none', visor:'band', mark:'bar' };
}
function approvalOfSession(sid) {
  return Object.values(state.pendingApprovals || {}).find(a => (a.card_session_id || a.session_id) === sid);
}
const cmdOf = a => { const ti = (a && a.tool_input) || {}; return typeof ti.command === 'string' ? ti.command : JSON.stringify(ti); };
const activeSessions = () => Object.values(state.sessions || {}).filter(s => s.slot_id).sort((a, b) => a.slot_id - b.slot_id);
const isActiveStatus = st => ['working', 'awaiting-approval', 'awaiting-input'].indexOf(st) >= 0;

function render() { renderCards(); renderWires(); renderLounge(); renderCounts(); renderQueue(); }

/* ---------- カード（両端に分けて配置） ---------- */
function ensureCard(sid) {
  if (cardEls[sid]) return cardEls[sid];
  const card = el('div', 'card');
  const avwrap = el('div', 'avwrap');
  const ring = el('div', 'ring');
  const av = el('div', 'av');
  avwrap.appendChild(ring); avwrap.appendChild(av);
  const nm = el('div', 'nm');
  const model = el('div', 'model');
  const panel = el('div', 'panel');
  const tk = el('div', 'tk');
  const st = el('div', 'st');
  const notice = el('div', '', 'width:100%');
  const close = el('button', 'close'); close.textContent = '✕'; close.title = 'スロットから外す';
  const jump = el('button', 'jumpic'); jump.textContent = '↗︎'; jump.title = 'タブへジャンプ'; jump.style.display = 'none';
  panel.appendChild(tk); panel.appendChild(st); panel.appendChild(notice);
  [avwrap, nm, model, panel, close, jump].forEach(n => card.appendChild(n));
  cardEls[sid] = { card, av, ring, nm, model, panel, tk, st, notice, jump, close };
  return cardEls[sid];
}

function renderCards() {
  const active = activeSessions();
  const n = active.length;
  document.getElementById('emptyHint').style.display = n ? 'none' : '';

  // 両端に振り分け（前半=左 / 後半=右、各側 最大3）
  const half = Math.ceil(n / 2);
  const leftSide = document.getElementById('leftSide');
  const rightSide = document.getElementById('rightSide');

  const alive = new Set(active.map(s => s.session_id));
  Object.keys(cardEls).forEach(sid => {
    if (!alive.has(sid)) { cardEls[sid].card.remove(); delete cardEls[sid]; delete lastAvatar[sid]; delete cardSide[sid]; }
  });

  active.forEach((s, i) => {
    const r = rosterOf(s.slot_id), e = ensureCard(s.session_id);
    const side = i < half ? 'L' : 'R';
    cardSide[s.session_id] = side;
    (side === 'L' ? leftSide : rightSide).appendChild(e.card);

    const st = STATUS[s.status] || STATUS.idle;
    const look = { id:'c' + s.session_id, color:r.color, body:r.body, deco:r.deco, visor:r.visor, mark:r.mark };
    const key = r.color + '|' + st.av;
    if (lastAvatar[s.session_id] !== key && typeof window.avatarSvg === 'function') {
      e.av.innerHTML = window.avatarSvg(look, st.av, 72); lastAvatar[s.session_id] = key;
    }

    const appr = approvalOfSession(s.session_id);
    const attn = !!appr || (s.browser && s.status === 'awaiting-input');
    e.card.className = 'card' + (attn ? ' attn' : '');
    e.av.style.animation = s.status === 'working' ? 'bob .9s ease-in-out infinite' : 'none';
    e.ring.style.display = appr ? '' : 'none';
    e.nm.textContent = r.name; e.nm.style.color = '#E6EDF7';
    e.model.textContent = s.model_name ? (s.browser ? '🌐 ' : '🤖 ') + s.model_name : '';

    if (editingTask !== s.session_id) {
      e.tk.style.display = '';
      e.tk.textContent = s.task || '作業名を入力…';
      e.tk.style.color = s.task ? r.color : '#3F4C61';
      e.tk.onclick = () => startEditTask(s.session_id, e, s.task || '');
    }

    let label = st.label, color = st.color;
    if (s.browser) {
      if (s.status === 'working') label = '● 生成中';
      else if (s.status === 'awaiting-input') { label = '✅ 確認してね'; color = '#FBBF24'; }
      else if (s.status === 'idle' || s.status === 'done') label = '🌐 表示中';
    }
    e.st.style.color = color;
    e.st.textContent = `${label} ${fmt(Date.now() - (s.status_changed_at || Date.now()))}`;

    renderNotice(e.notice, s, appr, r);

    e.close.onclick = () => clearSession(s.session_id);
    if (s.browser) { e.jump.style.display = ''; e.jump.onclick = () => jumpToTab(s.url); }  // ✕ の下にジャンプアイコン
    else { e.jump.style.display = 'none'; }
  });
}

/* ---------- 各カード → 球体 への配線 ---------- */
function renderWires() {
  const stage = document.getElementById('stage'), svg = document.getElementById('wires'), sphere = document.getElementById('sphere');
  const sr = stage.getBoundingClientRect(), sp = sphere.getBoundingClientRect();
  const active = activeSessions();
  const sig = `${Math.round(sr.width)}x${Math.round(sr.height)}|` +
    active.map(s => s.session_id + ':' + s.status + ':' + rosterOf(s.slot_id).color + ':' + (cardSide[s.session_id] || '')).join('|');
  if (sig === lastWireSig) return;                 // 位置・状態が変わらない限り作り直さない
  lastWireSig = sig;

  svg.setAttribute('viewBox', `0 0 ${sr.width} ${sr.height}`);
  svg.setAttribute('width', sr.width); svg.setAttribute('height', sr.height);
  svg.innerHTML = '';
  const cx = sp.left + sp.width / 2 - sr.left, cy = sp.top + sp.height / 2 - sr.top, R = sp.width / 2 * 0.9;
  const add = (t, at, style) => { const nn = document.createElementNS(NSVG, t); for (const k in at) nn.setAttribute(k, at[k]); if (style) nn.style.cssText = style; svg.appendChild(nn); return nn; };

  active.forEach(s => {
    const e = cardEls[s.session_id]; if (!e) return;
    const cr = e.card.getBoundingClientRect();
    const left = cardSide[s.session_id] === 'L';
    const ax = (left ? cr.right : cr.left) - sr.left, ay = cr.top + cr.height / 2 - sr.top;
    const dx = cx - ax, dy = cy - ay, L = Math.hypot(dx, dy) || 1;
    const ex = cx - dx / L * R, ey = cy - dy / L * R;               // 球体の縁で止める
    const mx = (ax + ex) / 2, my = (ay + ey) / 2 - 26;              // ゆるいカーブ
    const r = rosterOf(s.slot_id), on = isActiveStatus(s.status);
    const d = `M${ax},${ay} Q${mx},${my} ${ex},${ey}`;
    add('path', { d, fill:'none', stroke:r.color, 'stroke-width': on ? 1.6 : 1, opacity: on ? .8 : .22, 'stroke-dasharray': on ? '3 9' : '2 10', 'stroke-linecap':'round' },
      on ? 'animation:flow 1.1s linear infinite' : '');
    add('circle', { cx:ax, cy:ay, r:3.5, fill:'#08111F', stroke:r.color, 'stroke-width':1.3, opacity: on ? .95 : .4 });
    add('circle', { cx:ex, cy:ey, r:3, fill:r.color, opacity: on ? .9 : .3 });
  });
}

function renderNotice(box, s, appr, r) {
  if (appr) {
    box.className = 'notice appr';
    box.innerHTML = `<h4>${esc(r.name)}が判断を待っています 🔧 ${esc(appr.tool_name || '')}</h4>
      <div class="cmd">${esc(cmdOf(appr))}</div>
      <div class="bb"><button class="allow">✓ 許可</button><button class="deny">✕ 拒否</button></div>
      <button class="more">詳細を見る ›</button>`;
    box.querySelector('.allow').onclick = () => decide(appr.id, 'allow');
    box.querySelector('.deny').onclick = () => decide(appr.id, 'deny');
    box.querySelector('.more').onclick = () => openDetail(appr.id);
    return;
  }
  if (s.status === 'awaiting-input') {
    if (s.browser) {
      box.className = 'notice done';
      box.innerHTML = `<h4>回答が完了！確認してね 👀</h4><div style="font-size:11px;color:#B0895A;">ブラウザのタブで確認できます</div>`;
    } else {
      box.className = 'notice inp';
      box.innerHTML = `<h4>入力を待ってます 💬</h4><div style="font-size:11.5px;color:#9FB6D0;">${esc(s.detail || '入力待ち')}<span style="animation:caret 1s step-end infinite">_</span></div>`;
    }
    return;
  }
  box.className = ''; box.innerHTML = '';
}

function startEditTask(sid, e, cur) {
  editingTask = sid;
  const input = el('input', 'taskin'); input.value = cur; input.placeholder = '作業名を入力';
  e.tk.style.display = 'none'; e.tk.after(input); input.focus(); input.select();
  const done = save => { editingTask = null; input.remove(); e.tk.style.display = ''; if (save) saveTask(sid, input.value); else render(); };
  input.onkeydown = ev => { if (ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229) done(true); else if (ev.key === 'Escape') done(false); };
  input.onblur = () => { if (editingTask === sid) done(true); };
}

/* ---------- 待機室 ---------- */
function renderLounge() {
  const box = document.getElementById('lounge');
  const activeSlots = new Set(activeSessions().map(s => s.slot_id));
  const resting = [1,2,3,4,5,6].filter(id => !activeSlots.has(id));
  box.innerHTML = '';
  if (!resting.length) { box.innerHTML = '<div style="color:#3F4C61;font-size:12px;">全員稼働中です</div>'; return; }
  resting.forEach(id => {
    const r = rosterOf(id);
    const wrap = el('div', 'rest');

    if (typeof window.avatarSvg === 'function')

}

/* ---------- 球体（ワイヤーコア） ---------- */
let MESH = null;
function buildMesh() {
  if (MESH) return MESH;
  let s = 19; const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
  const C = 120, R = 106, STEP = 9.2, pts = [];
  for (let gy = C - R; gy < C + R; gy += STEP)
    for (let gx = C - R; gx < C + R; gx += STEP) {
      const x = gx + (rnd() - .5) * STEP * .9, y = gy + (rnd() - .5) * STEP * .9;
      if (Math.hypot(x - C, y - C) <= R) pts.push({ x, y });
    }
  const BASE = ['#38BDF8', '#7DD3FC', '#0EA5E9', '#60A5FA'];
  pts.forEach((p, i) => { p.c = BASE[(i * 5) % BASE.length]; });
  const seen = {}, edges = [], adj = pts.map(() => []);
  pts.forEach((p, i) => {
    pts.map((q, j) => ({ j, d:(q.x - p.x) ** 2 + (q.y - p.y) ** 2 }))
      .filter(o => o.j !== i).sort((a, b) => a.d - b.d).slice(0, 3)
      .forEach(o => { const k = i < o.j ? i + '-' + o.j : o.j + '-' + i; if (seen[k]) return; seen[k] = 1; edges.push([pts[i], pts[o.j]]); adj[i].push(o.j); adj[o.j].push(i); });
  });
  MESH = { pts, edges, adj, C, R };
  return MESH;
}
function renderCore() {
  const { pts, edges, C, R } = buildMesh();
  const svg = document.createElementNS(NSVG, 'svg');
  svg.setAttribute('viewBox', '0 0 240 240');
  const add = (t, at) => { const n = document.createElementNS(NSVG, t); for (const k in at) n.setAttribute(k, at[k]); svg.appendChild(n); return n; };
  add('circle', { cx:C, cy:C, r:R, fill:'rgba(8,22,44,.5)', stroke:'#1D5B8F', 'stroke-width':1, opacity:.8 });
  add('ellipse', { cx:C, cy:C, rx:R, ry:R * .34, fill:'none', stroke:'#17466E', 'stroke-width':.9 });
  add('ellipse', { cx:C, cy:C, rx:R * .34, ry:R, fill:'none', stroke:'#17466E', 'stroke-width':.9 });
  edges.forEach(([a, b]) => add('line', { x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:'#2E7BB8', 'stroke-width':.5, opacity:.5 }));
  pts.forEach(p => add('circle', { cx:p.x, cy:p.y, r:.95, fill:p.c, opacity:.8 }));
  const beams = document.createElementNS(NSVG, 'g'); beams.setAttribute('id', 'beams'); svg.appendChild(beams);
  const sphere = document.getElementById('sphere'); sphere.innerHTML = ''; sphere.appendChild(svg);
}
function activeSources() {
  const out = [];
  Object.values(state.sessions || {}).forEach(s => { if (isActiveStatus(s.status)) out.push({ c: rosterOf(s.slot_id).color || '#38BDF8', ang: (s.slot_id * 57) % 360 }); });
  return out;
}
function fireBeams() {
  const beams = document.getElementById('beams'); if (!beams) return;
  const src = activeSources();
  const sig = src.map(s => s.c + ':' + s.ang).join('|');
  if (sig === lastBeamSig) return;                 // 稼働が変わらない限り再生成しない＝連続して滑らかに流す
  lastBeamSig = sig;
  beams.innerHTML = '';
  if (!src.length) return;
  const { pts, adj, C, R } = buildMesh();
  const rand = (a, b) => a + Math.random() * (b - a);
  const rimAt = deg => { const a = deg * Math.PI / 180, tx = C + Math.cos(a) * R, ty = C + Math.sin(a) * R; let best = 0, bd = Infinity; pts.forEach((p, i) => { const d = (p.x - tx) ** 2 + (p.y - ty) ** 2; if (d < bd) { bd = d; best = i; } }); return best; };
  const route = (from, to) => { const prev = { [from]: -1 }, q = [from]; while (q.length) { const cur = q.shift(); if (cur === to) break; adj[cur].forEach(nn => { if (!(nn in prev)) { prev[nn] = cur; q.push(nn); } }); } if (!(to in prev)) return null; const seq = []; for (let nn = to; nn !== -1; nn = prev[nn]) seq.push(pts[nn]); return seq.reverse(); };
  const n = Math.random() < .4 ? 1 : Math.min(2, src.length);
  for (let i = 0; i < n; i++) {
    const s = src[Math.floor(Math.random() * src.length)];
    const from = s.ang + rand(-20, 20);
    const seq = route(rimAt(from), rimAt(from + 180 + rand(-52, 52)));
    if (!seq || seq.length < 3) continue;
    const d = 'M' + seq.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L');
    let len = 0; for (let k = 1; k < seq.length; k++) len += Math.hypot(seq[k].x - seq[k - 1].x, seq[k].y - seq[k - 1].y);
    const seg = 46, P = Math.ceil(len) + seg, dur = Math.max(1.1, len * rand(.0062, .0115)).toFixed(2), delay = rand(0, 4.5).toFixed(2);
    const path = (w, op, stroke, lag, sg) => { const p = document.createElementNS(NSVG, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke-linecap', 'round'); p.style.stroke = stroke || s.c; p.style.strokeWidth = w; p.style.opacity = op; p.style.strokeDasharray = `${sg || seg} ${P - (sg || seg)}`; p.style.setProperty('--dash-to', -P); p.style.animation = `dashRun ${dur}s linear ${(parseFloat(delay) + lag).toFixed(2)}s infinite`; beams.appendChild(p); };
    const trace = document.createElementNS(NSVG, 'path'); trace.setAttribute('d', d); trace.setAttribute('fill', 'none'); trace.setAttribute('stroke', s.c); trace.setAttribute('stroke-width', .8); trace.setAttribute('opacity', .16); trace.setAttribute('stroke-linecap', 'round'); beams.appendChild(trace);
    [[.46, .8, .07], [.34, .85, .12], [.23, .95, .2], [.13, .95, .32], [.05, .95, .55]].forEach(([lag, w, op]) => path(w, op, null, lag));
    path(3, .12, null, .1); path(.95, .92, null, 0); path(.5, .95, '#F6FCFF', 0, seg * .42);
  }
}

// 1秒ごとの軽量更新（経過時間と時計だけ。全再描画しないので光線が途切れない）
function tick() {
  const clk = document.getElementById('clock'); if (clk) clk.textContent = new Date().toLocaleTimeString('ja-JP');
  activeSessions().forEach(s => {
    const e = cardEls[s.session_id]; if (!e) return;
    const st = STATUS[s.status] || STATUS.idle;
    let label = st.label, color = st.color;
    if (s.browser) {
      if (s.status === 'working') label = '● 生成中';
      else if (s.status === 'awaiting-input') { label = '✅ 確認してね'; color = '#FBBF24'; }
      else if (s.status === 'idle' || s.status === 'done') label = '🌐 表示中';
    }
    e.st.style.color = color;
    e.st.textContent = `${label} ${fmt(Date.now() - (s.status_changed_at || Date.now()))}`;
  });
}

function renderCounts() {
  const c = { working:0, 'awaiting-approval':0, 'awaiting-input':0, idle:0, done:0, error:0 };
  Object.values(state.sessions || {}).forEach(s => { if (c[s.status] != null) c[s.status]++; });
  const empty = 6 - Object.values(state.sessions || {}).length;
  document.getElementById('counts').innerHTML =
    `<span style="color:#34D399">●${c.working}</span>
     <span style="color:#FBBF24">◉${c['awaiting-approval']}</span>
     <span style="color:#60A5FA">◐${c['awaiting-input']}</span>
     <span style="color:#8494AC">○${c.idle + c.done}</span>
     <span style="color:#3F4C61">空き${Math.max(0, empty)}</span>`;
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('ja-JP');
}
function renderQueue() {
  const q = state.queue || [], box = document.getElementById('queue');
  box.innerHTML = q.length
    ? q.map((it, i) => `<div class="chip">#${i + 1} ${esc(it.cwd ? it.cwd.split('/').pop() : 'unknown')} · ${esc((it.session_id || '').substring(0, 8))}</div>`).join('')
    : '<div class="chip">空</div>';
}

/* ---------- API ---------- */
async function decide(id, decision) { try { await fetch(`${API}/api/approvals/${id}/decision`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ decision, reason:'' }) }); } catch (e) { console.error(e); } }
async function resetTimer(sid) { try { await fetch(`${API}/api/sessions/${sid}/reset-timer`, { method:'POST' }); } catch (e) { console.error(e); } }
async function saveTask(sid, task) { try { await fetch(`${API}/api/sessions/${sid}/task`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ task }) }); } catch (e) { console.error(e); } render(); }
async function clearSession(sid) { try { await fetch(`${API}/api/sessions/${sid}`, { method:'DELETE' }); } catch (e) { console.error(e); } render(); }
async function clearAll() { try { await fetch(`${API}/api/sessions/clear`, { method:'POST' }); } catch (e) { console.error(e); } render(); }
async function jumpToTab(url) { if (!url) return; try { await fetch(`${API}/api/tabs/activate`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ url }) }); } catch (e) { console.error(e); } }

/* ---------- 接続モーダル ---------- */
function openConnect() { document.getElementById('connectModal').classList.add('open'); refreshDiscover(); }
function closeConnect() { document.getElementById('connectModal').classList.remove('open'); }
async function refreshDiscover() {
  const list = document.getElementById('discoverList');
  list.innerHTML = '<div class="hint" style="text-align:center">読み込み中...</div>';
  try {
    const res = await fetch(`${API}/api/discover`);
    const data = await res.json();
    discovered = data.sessions || [];
    const tabs = data.tabs || [];
    if (!discovered.length && !tabs.length) { list.innerHTML = '<div class="hint" style="text-align:center">稼働中の AI が見つかりません</div>'; return; }
    const procHtml = discovered.map((s, i) => `
      <div class="item"><div><div class="p">📁 ${esc(s.project)}</div>
        <div class="m">PID ${esc(String(s.pid))}${s.started ? ' · ' + esc(s.started) : ''}</div></div>
        ${s.connected ? '<span class="m">接続済み</span>' : `<button class="btn" data-i="${i}">接続</button>`}</div>`).join('');
    const tabHtml = tabs.map((t, i) => `
      <div class="item"><div style="min-width:0;"><div class="p">🌐 ${esc(t.project)}</div>
        <div class="m" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;">${esc(t.ai_name)} · ${esc(t.url)}</div></div>
        ${t.connected ? '<span class="m">接続済み</span>' : `<button class="btn" data-t="${i}">接続</button>`}</div>`).join('');
    list.innerHTML =
      (procHtml ? `<div class="hint">🖥 ネイティブ（ライブ連携）</div>${procHtml}` : '') +
      (tabHtml ? `<div class="hint" style="margin-top:12px">🌐 ブラウザのAI（存在表示・生成検知）</div>${tabHtml}` : '');
    list.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => connectDiscovered(discovered[+b.dataset.i]));
    list.querySelectorAll('button[data-t]').forEach(b => b.onclick = () => connectTab(tabs[+b.dataset.t]));
  } catch (e) { list.innerHTML = '<div class="hint" style="text-align:center;color:#FCA5A5">検知に失敗しました</div>'; }
}
async function connectDiscovered(s) {
  if (!s) return;
  try { await fetch(`${API}/api/events`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ adapter:'discovered', session_id:s.session_id, cwd:s.cwd || ('/' + s.project), kind:'start', model_name:s.ai_name || 'AI', detail:'接続しました', ts:Math.floor(Date.now() / 1000) }) }); refreshDiscover(); render(); } catch (e) { console.error(e); }
}
async function connectTab(t) {
  if (!t) return;
  try { await fetch(`${API}/api/events`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ adapter:'browser', session_id:t.session_id, cwd:t.url, url:t.url, kind:'start', model_name:t.ai_name || 'AI', detail:'ブラウザで開いています', ts:Math.floor(Date.now() / 1000) }) }); refreshDiscover(); render(); } catch (e) { console.error(e); }
}

/* ---------- 詳細モーダル ---------- */
function openDetail(id) {
  const a = (state.pendingApprovals || {})[id]; if (!a) return;
  const s = state.sessions[a.card_session_id] || state.sessions[a.session_id] || {};
  const r = rosterOf(s.slot_id);
  document.getElementById('detailTitle').textContent = `${r.name || 'AI'} の判断待ち`;
  document.getElementById('detailBody').innerHTML = `
    <div class="drow"><div class="dlabel">キャラクター / AI</div><div class="dval">${esc(r.name || '-')}${s.model_name ? ' · ' + esc(s.model_name) : ''}</div></div>
    <div class="drow"><div class="dlabel">ツール</div><div class="dval">🔧 ${esc(a.tool_name || '-')}</div></div>
    <div class="drow"><div class="dlabel">内容</div><div class="dval">${esc(cmdOf(a))}</div></div>
    <div class="drow"><div class="dlabel">作業ディレクトリ</div><div class="dval">${esc(a.cwd || s.cwd || '-')}</div></div>
    <div class="drow"><div class="dlabel">経過</div><div class="dval">⏱️ ${fmt(Date.now() - (a.created_at || Date.now()))}</div></div>`;
  const act = document.getElementById('detailActions');
  act.innerHTML = '<button class="allow">✓ 許可</button><button class="deny">✕ 拒否</button>';
  act.querySelector('.allow').onclick = () => { decide(a.id, 'allow'); closeDetail(); };
  act.querySelector('.deny').onclick = () => { decide(a.id, 'deny'); closeDetail(); };
  document.getElementById('detailModal').classList.add('open');
}
function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

/* ---------- WebSocket ---------- */
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { const c = document.getElementById('conn'); c.textContent = '● 接続中'; c.className = 'conn mono'; };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'initial_state' || msg.type === 'state_update') {
      state = msg.data;
      if (editingTask === null) render();
      fireBeams();                                   // sig 変化時のみ再生成（内部でガード）
    }
  };
  ws.onclose = () => { const c = document.getElementById('conn'); c.textContent = '接続なし'; c.className = 'conn off mono'; setTimeout(connectWS, 3000); };
  ws.onerror = e => console.error('WebSocket error', e);
}

window.addEventListener('resize', () => { lastWireSig = ''; renderWires(); });
renderCore();
render();
connectWS();
setInterval(() => { if (editingTask === null) tick(); }, 1000);
fireBeams();
</script>
