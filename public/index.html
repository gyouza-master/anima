<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>anima - 管制塔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#06090F; color:#E6EDF7; font-family:'Zen Kaku Gothic New',-apple-system,BlinkMacSystemFont,sans-serif; }
  .mono { font-family:'IBM Plex Mono',Monaco,monospace; }

  @keyframes flow { to { stroke-dashoffset:-36; } }
  @keyframes flowSlow { to { stroke-dashoffset:-24; } }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  @keyframes breathe { 0%,100%{opacity:.35} 50%{opacity:.9} }
  @keyframes pulseRing { 0%,100%{transform:scale(1);opacity:.55} 50%{transform:scale(1.12);opacity:.12} }
  @keyframes caret { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  @keyframes dashRun { from { stroke-dashoffset:0; } to { stroke-dashoffset:var(--dash-to); } }

  .shell { width:1060px; margin:0 auto; background:#080C14; border:1px solid #1A2231; border-radius:18px; overflow:hidden; transform-origin:top center; }
  .bar { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid #161E2C; background:#0A0F1A; }
  .brand { display:flex; align-items:center; gap:11px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#38BDF8; box-shadow:0 0 12px #38BDF8; }
  .logo { font-weight:700; font-size:16px; letter-spacing:.1em; }
  .sub { font-size:11px; color:#4E5D75; }
  .actions { display:flex; align-items:center; gap:9px; }
  .conn { font-size:11px; padding:5px 11px; border-radius:999px; border:1px solid #17453A; background:#0A1B17; color:#34D399; }
  .conn.off { border-color:#4B2026; background:#1B0F12; color:#FCA5A5; }
  .btn { font-size:12px; font-weight:600; padding:7px 14px; border-radius:8px; border:none; background:#38BDF8; color:#06090F; cursor:pointer; }
  .btn:hover { filter:brightness(1.08); }
  .btn.ghost { background:transparent; border:1px solid #212B3D; color:#8494AC; font-weight:500; }
  .btn.ghost:hover { border-color:#33415C; color:#C3D0E2; }

  .strip { display:flex; align-items:center; justify-content:space-between; padding:12px 26px; border-bottom:1px solid #161E2C; background:linear-gradient(90deg,rgba(56,189,248,.07),transparent 65%); }
  .strip .label { font-size:11px; letter-spacing:.16em; color:#3F7EA8; }
  .counts { display:flex; gap:16px; font-size:12px; font-weight:500; }

  .stage { position:relative; width:1000px; height:620px; margin:0 30px; }
  .glow { position:absolute; left:250px; top:50px; width:500px; height:500px; border-radius:50%;
          background:radial-gradient(circle at 50% 50%, rgba(56,189,248,.12), rgba(6,9,15,0) 68%); }
  .wires, .marks { position:absolute; left:0; top:0; pointer-events:none; }
  .wires { z-index:1; } .marks { z-index:4; }
  .core { position:absolute; left:380px; top:180px; width:240px; height:240px; z-index:2; }

  .slot { position:absolute; width:150px; margin-left:-75px; margin-top:-62px; z-index:3;
          display:flex; flex-direction:column; align-items:center; gap:4px; }
  .slot .av { width:70px; height:70px; display:flex; align-items:center; justify-content:center; }
  .slot .nm { font-size:13.5px; font-weight:700; }
  .slot .tk { font-size:10.5px; font-weight:500; cursor:pointer; text-align:center; max-width:150px; }
  .slot .tk:hover { text-decoration:underline; }
  .slot .st { font-size:10.5px; font-weight:500; font-family:'IBM Plex Mono',monospace; }
  .slot .row { display:flex; gap:5px; margin-top:1px; }
  .mini { font-size:10px; border:1px solid #212B3D; background:transparent; color:#5B6B84; border-radius:6px; padding:2px 6px; cursor:pointer; }
  .mini:hover { color:#C3D0E2; border-color:#33415C; }
  .assign { font-size:10.5px; font-family:'IBM Plex Mono',monospace; color:#38BDF8; border:1px dashed #1B3F55;
            background:transparent; padding:4px 10px; border-radius:7px; cursor:pointer; }
  .taskin { font-size:12px; padding:4px 7px; border:1px solid #38BDF8; background:#0A1220; color:#E6EDF7; border-radius:6px; width:140px; }

  .bubble { position:absolute; z-index:5; width:300px; border-radius:14px; padding:14px 15px; }
  .bubble.appr { background:#12111A; border:1px solid #48381A; box-shadow:0 18px 50px rgba(251,191,36,.16); }
  .bubble.inp { background:#0B1523; border:1px solid #1E3A55; width:270px; }
  .bubble h4 { font-size:12.5px; font-weight:700; color:#FBBF24; margin-bottom:9px; }
  .bubble.inp h4 { color:#93C5FD; }
  .cmd { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#E8C583; background:#1A1710;
         border-radius:8px; padding:9px 10px; margin-bottom:11px; word-break:break-all; max-height:56px; overflow:hidden; }
  .bubble.inp .cmd { color:#9FB6D0; background:transparent; padding:0; margin:0; }
  .bb { display:flex; gap:8px; }
  .allow { flex:1; font-size:12.5px; font-weight:700; border:none; border-radius:8px; padding:9px; background:#34D399; color:#06251B; cursor:pointer; }
  .deny { flex:1; font-size:12.5px; font-weight:700; border:1px solid #4B2026; border-radius:8px; padding:8px; background:#2A1417; color:#FCA5A5; cursor:pointer; }
  .more { display:block; width:100%; margin-top:8px; background:none; border:none; color:#8494AC; font-size:11px; cursor:pointer; }
  .more:hover { color:#C3D0E2; }

  .queue { display:flex; align-items:center; gap:14px; padding:13px 26px; border-top:1px solid #161E2C; background:#0A0F1A; }
  .queue .label { font-size:11px; letter-spacing:.08em; color:#4E5D75; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8494AC; background:#101724; border:1px solid #1C2536; padding:5px 11px; border-radius:999px; }

  .modal { display:none; position:fixed; inset:0; background:rgba(3,6,12,.72); z-index:1000; align-items:center; justify-content:center; }
  .modal.open { display:flex; }
  .sheet { width:90%; max-width:500px; max-height:80vh; overflow-y:auto; background:#0B111C; border:1px solid #1E2739;
           border-radius:16px; padding:24px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .sheet h2 { font-size:17px; font-weight:700; }
  .sheet .hint { font-size:12px; color:#5B6B84; margin:6px 0 16px; }
  .item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px;
          border:1px solid #1C2536; border-radius:10px; margin-bottom:8px; background:#0A1220; }
  .item .p { font-size:13px; font-weight:700; }
  .item .m { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#4E5D75; }
  .drow { margin-bottom:12px; }
  .dlabel { font-size:11px; color:#4E5D75; margin-bottom:4px; }
  .dval { font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#C3D0E2; background:#0A1220;
          border:1px solid #18202E; border-radius:8px; padding:8px 10px; word-break:break-all; white-space:pre-wrap; }
</style>
</head>
<body>

<div class="shell" id="shell">
  <div class="bar">
    <div class="brand">
      <div class="dot"></div>
      <div class="logo">anima</div>
      <div class="sub mono">管制塔 · localhost:4317</div>
    </div>
    <div class="actions">
      <div class="conn off mono" id="conn">接続なし</div>
      <button class="btn" onclick="openConnect()">＋ 接続</button>
      <button class="btn ghost" onclick="clearAll()">全クリア</button>
    </div>
  </div>

  <div class="strip">
    <div style="display:flex;align-items:center;gap:18px;">
      <div class="label mono">ANIMA CORE</div>
      <div class="counts mono" id="counts"></div>
    </div>
    <div class="mono" style="font-size:11px;color:#4E5D75;" id="clock"></div>
  </div>

  <div class="stage" id="stage">
    <div class="glow"></div>
    <svg class="wires" id="wires" width="1000" height="620"></svg>
    <div class="core" id="core"></div>
    <svg class="marks" id="marks" width="1000" height="620"></svg>
  </div>

  <div class="queue">
    <div class="label">待機キュー</div>
    <div class="chips" id="queue"><div class="chip">空</div></div>
  </div>
</div>

<div class="modal" id="connectModal">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2>稼働中の AI を選択</h2>
      <button class="btn ghost" onclick="refreshDiscover()">🔄 更新</button>
    </div>
    <div class="hint">今このMacで動いている AI セッションの一覧です。</div>
    <div id="discoverList"></div>
    <button class="btn ghost" style="width:100%;padding:11px;" onclick="closeConnect()">閉じる</button>
  </div>
</div>

<div class="modal" id="detailModal">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 id="detailTitle">判断内容の詳細</h2>
      <button class="btn ghost" onclick="closeDetail()">✕ 閉じる</button>
    </div>
    <div id="detailBody"></div>
    <div class="bb" style="margin-top:18px;" id="detailActions"></div>
  </div>
</div>

<script src="/avatar.js"></script>
<script>
/* ---------- 定数 ---------- */
const API = '';                                  // 同一オリジン（daemon が配信）
const WS_URL = `ws://${location.hostname}:${location.port || 4317}/ws`;
const CX = 500, CY = 300, ORB_R = 116;            // コア中心と配線の到達半径
const SLOT_ANGLE = { 1:200, 2:270, 3:346, 4:21, 5:90, 6:159 };
const RX = 290, RY = 200;                         // スロット配置の楕円

const STATUS = {
  'working':            { label:'● 動作中',  color:'#34D399', wire:'work',  av:'working' },
  'awaiting-approval':  { label:'◉ 判断待ち', color:'#FBBF24', wire:'gate',  av:'waiting' },
  'awaiting-input':     { label:'◐ 入力待ち', color:'#60A5FA', wire:'slow',  av:'waiting' },
  'idle':               { label:'○ 返信待ち', color:'#5B6B84', wire:'dim',   av:'idle' },
  'done':               { label:'○ 完了',    color:'#5B6B84', wire:'dim',   av:'done' },
  'error':              { label:'× エラー',  color:'#FCA5A5', wire:'gate',  av:'error' }
};
const WIRE = {
  work: { w:0.9, o:0.60, dash:'3 9',  anim:'flow 1.1s linear infinite' },
  gate: { w:1.2, o:0.85, dash:'8 6',  anim:'breathe 1.2s ease-in-out infinite' },
  slow: { w:0.9, o:0.45, dash:'5 8',  anim:'flowSlow 2.4s linear infinite' },
  dim:  { w:0.8, o:0.22, dash:'2 10', anim:null },
  off:  { w:0.7, o:0.12, dash:'1 12', anim:null }
};

let state = { sessions:{}, queue:[], pendingApprovals:{}, roster:[] };
let ws = null, editingTask = null, discovered = [];
const slotEls = {};            // slot_id -> DOM 参照
const lastAvatar = {};         // slot_id -> 'color|state'
let lastWireSig = '';

/* ---------- ユーティリティ ---------- */
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const el = (tag, cls, css) => { const n = document.createElement(tag); if (cls) n.className = cls; if (css) n.style.cssText = css; return n; };
const slotPos = id => {
  const a = (SLOT_ANGLE[id] || 0) * Math.PI / 180;
  return { x: CX + Math.cos(a) * RX, y: CY + Math.sin(a) * RY };
};
function fmt(ms) {
  if (!ms || ms < 0) return '0:00';
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
function rosterOf(id) {
  return (state.roster || []).find(r => r.id === id) ||
    { id, name:`スロット ${id}`, color:'#4E5D75', body:'slim', deco:'none', visor:'band', mark:'bar' };
}
const sessionOfSlot = id => Object.values(state.sessions || {}).find(s => s.slot_id === id);
function approvalOfSession(sid) {
  return Object.values(state.pendingApprovals || {}).find(a => (a.card_session_id || a.session_id) === sid);
}
const cmdOf = a => { const ti = (a && a.tool_input) || {}; return typeof ti.command === 'string' ? ti.command : JSON.stringify(ti); };

/* ---------- コアのワイヤーメッシュ（生成は一度だけ） ---------- */
let MESH = null;
function buildMesh() {
  if (MESH) return MESH;
  let s = 19; const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
  const C = 120, R = 106, STEP = 9.2, pts = [];
  for (let gy = C - R; gy < C + R; gy += STEP)
    for (let gx = C - R; gx < C + R; gx += STEP) {
      const x = gx + (rnd() - .5) * STEP * .9, y = gy + (rnd() - .5) * STEP * .9;
      if (Math.hypot(x - C, y - C) <= R) pts.push({ x, y });
    }
  const BASE = ['#38BDF8', '#7DD3FC', '#0EA5E9', '#60A5FA'];
  pts.forEach((p, i) => { p.c = BASE[(i * 5) % BASE.length]; });
  const seen = {}, edges = [], adj = pts.map(() => []);
  pts.forEach((p, i) => {
    pts.map((q, j) => ({ j, d:(q.x - p.x) ** 2 + (q.y - p.y) ** 2 }))
      .filter(o => o.j !== i).sort((a, b) => a.d - b.d).slice(0, 3)
      .forEach(o => {
        const k = i < o.j ? i + '-' + o.j : o.j + '-' + i;
        if (seen[k]) return; seen[k] = 1;
        edges.push([pts[i], pts[o.j]]); adj[i].push(o.j); adj[o.j].push(i);
      });
  });
  MESH = { pts, edges, adj, C, R };
  return MESH;
}

function renderCore() {
  const { pts, edges, C, R } = buildMesh();
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', 240); svg.setAttribute('height', 240);
  svg.setAttribute('viewBox', '0 0 240 240'); svg.style.display = 'block';
  const add = (t, at) => { const n = document.createElementNS(ns, t); for (const k in at) n.setAttribute(k, at[k]); svg.appendChild(n); return n; };
  add('circle', { cx:C, cy:C, r:R, fill:'rgba(8,22,44,.5)', stroke:'#1D5B8F', 'stroke-width':1, opacity:.8 });
  add('ellipse', { cx:C, cy:C, rx:R, ry:R * .34, fill:'none', stroke:'#17466E', 'stroke-width':.9 });
  add('ellipse', { cx:C, cy:C, rx:R * .34, ry:R, fill:'none', stroke:'#17466E', 'stroke-width':.9 });
  edges.forEach(([a, b]) => add('line', { x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:'#2E7BB8', 'stroke-width':.5, opacity:.55 }));
  pts.forEach(p => add('circle', { cx:p.x, cy:p.y, r:.95, fill:p.c, opacity:.8 }));
  const beams = document.createElementNS(ns, 'g');
  beams.setAttribute('id', 'beams');
  svg.appendChild(beams);
  const core = document.getElementById('core');
  core.innerHTML = ''; core.appendChild(svg);
}

/* ---------- 光線：稼働中セッションの色で、縁 → メッシュ → 反対の縁へ ---------- */
function activeSources() {
  const out = [];
  Object.values(state.sessions || {}).forEach(s => {
    if (['working', 'awaiting-approval', 'awaiting-input'].indexOf(s.status) < 0) return;
    const r = rosterOf(s.slot_id);
    out.push({ c:r.color || '#38BDF8', ang: SLOT_ANGLE[s.slot_id] || 0 });
  });
  return out;
}
function fireBeams() {
  const beams = document.getElementById('beams');
  if (!beams) return;
  beams.innerHTML = '';
  const src = activeSources();
  if (!src.length) return;                       // 誰も動いていなければ光らない
  const { pts, adj, C, R } = buildMesh();
  const ns = 'http://www.w3.org/2000/svg';
  const rand = (a, b) => a + Math.random() * (b - a);
  const rimAt = deg => {
    const a = deg * Math.PI / 180, tx = C + Math.cos(a) * R, ty = C + Math.sin(a) * R;
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => { const d = (p.x - tx) ** 2 + (p.y - ty) ** 2; if (d < bd) { bd = d; best = i; } });
    return best;
  };
  const route = (from, to) => {
    const prev = { [from]: -1 }, q = [from];
    while (q.length) { const cur = q.shift(); if (cur === to) break; adj[cur].forEach(n => { if (!(n in prev)) { prev[n] = cur; q.push(n); } }); }
    if (!(to in prev)) return null;
    const seq = []; for (let n = to; n !== -1; n = prev[n]) seq.push(pts[n]);
    return seq.reverse();
  };
  const n = Math.random() < .4 ? 1 : Math.min(2, src.length);
  for (let i = 0; i < n; i++) {
    const s = src[Math.floor(Math.random() * src.length)];
    const from = s.ang + rand(-20, 20);
    const seq = route(rimAt(from), rimAt(from + 180 + rand(-52, 52)));
    if (!seq || seq.length < 3) continue;
    const d = 'M' + seq.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L');
    let len = 0; for (let k = 1; k < seq.length; k++) len += Math.hypot(seq[k].x - seq[k - 1].x, seq[k].y - seq[k - 1].y);
    const seg = 46, P = Math.ceil(len) + seg, dur = Math.max(1.1, len * rand(.0062, .0115)).toFixed(2), delay = rand(0, 4.5).toFixed(2);
    const path = (w, op, stroke, lag, sg) => {
      const p = document.createElementNS(ns, 'path');
      p.setAttribute('d', d); p.setAttribute('fill', 'none');
      p.setAttribute('stroke-linecap', 'round');
      p.style.stroke = stroke || s.c; p.style.strokeWidth = w; p.style.opacity = op;
      p.style.strokeDasharray = `${sg || seg} ${P - (sg || seg)}`;
      p.style.setProperty('--dash-to', -P);
      p.style.animation = `dashRun ${dur}s linear ${(parseFloat(delay) + lag).toFixed(2)}s infinite`;
      beams.appendChild(p);
    };
    const trace = document.createElementNS(ns, 'path');
    trace.setAttribute('d', d); trace.setAttribute('fill', 'none');
    trace.setAttribute('stroke', s.c); trace.setAttribute('stroke-width', 1.1);
    trace.setAttribute('opacity', .2); trace.setAttribute('stroke-linecap', 'round');
    beams.appendChild(trace);
    [[.46, 1.2, .07], [.34, 1.3, .12], [.23, 1.4, .2], [.13, 1.4, .32], [.05, 1.4, .55]]
      .forEach(([lag, w, op]) => path(w, op, null, lag));
    path(4.4, .13, null, .1);
    path(1.5, .92, null, 0);
    path(.7, .95, '#F6FCFF', 0, seg * .42);
  }
}

/* ---------- 配線（6ポート） ---------- */
function renderWires() {
  const sig = [1,2,3,4,5,6].map(id => {
    const s = sessionOfSlot(id);
    return id + ':' + (s ? s.status : 'empty') + ':' + rosterOf(id).color;
  }).join('|');
  if (sig === lastWireSig) return;               // 状態が変わらない限り作り直さない
  lastWireSig = sig;

  const ns = 'http://www.w3.org/2000/svg';
  const wires = document.getElementById('wires'), marks = document.getElementById('marks');
  wires.innerHTML = ''; marks.innerHTML = '';
  const add = (parent, t, at, style) => {
    const n = document.createElementNS(ns, t);
    for (const k in at) n.setAttribute(k, at[k]);
    if (style) n.style.cssText = style;
    parent.appendChild(n); return n;
  };
  [150, 212, 274].forEach(r => add(wires, 'circle', { cx:CX, cy:CY, r, fill:'none', stroke:'#14243A', 'stroke-width':.9, 'stroke-dasharray':'2 9' }));

  [1,2,3,4,5,6].forEach(id => {
    const r = rosterOf(id), s = sessionOfSlot(id);
    const st = s ? (STATUS[s.status] || STATUS.idle) : null;
    const w = WIRE[st ? st.wire : 'off'];
    const p = slotPos(id);
    const dx = CX - p.x, dy = CY - p.y, L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    const sx = p.x + ux * 48, sy = p.y + uy * 48;
    const ex = CX - ux * ORB_R, ey = CY - uy * ORB_R;
    for (let k = -1; k <= 1; k++) {
      const mx = (sx + ex) / 2 + nx * k * 17, my = (sy + ey) / 2 + ny * k * 17;
      const d = `M${sx + nx * k * 5},${sy + ny * k * 5} Q${mx},${my} ${ex + nx * k * 4},${ey + ny * k * 4}`;
      add(wires, 'path', {
        d, fill:'none', stroke:r.color, 'stroke-width': k === 0 ? w.w : w.w * .7,
        opacity: k === 0 ? w.o : w.o * .6, 'stroke-dasharray': w.dash
      }, w.anim ? `animation:${w.anim};animation-delay:${(k + 1) * .16}s` : '');
    }
    add(wires, 'circle', { cx:ex, cy:ey, r:4.2, fill:'#08111F', stroke:r.color, 'stroke-width':1.3, opacity: st ? .9 : .3 });

    // 判断待ちは配線上にゲート記号
    if (s && s.status === 'awaiting-approval') {
      const gx = sx + (ex - sx) * .34, gy = sy + (ey - sy) * .34;
      add(marks, 'circle', { cx:gx, cy:gy, r:13, fill:'#12111A', stroke:'#FBBF24', 'stroke-width':2 });
      add(marks, 'path', { d:`M${gx - 6},${gy} h12 M${gx},${gy - 6} v12`, stroke:'#FBBF24', 'stroke-width':2, 'stroke-linecap':'round' });
    }
  });
}

/* ---------- スロット（DOMは一度作って以後は更新のみ） ---------- */
function ensureSlot(id) {
  if (slotEls[id]) return slotEls[id];
  const p = slotPos(id);
  const root = el('div', 'slot', `left:${p.x}px;top:${p.y}px`);
  const av = el('div', 'av');
  const ring = el('div', '', 'position:absolute;inset:-9px;border-radius:50%;border:2px solid #FBBF24;animation:pulseRing 1.3s ease-in-out infinite;display:none');
  const avWrap = el('div', '', 'position:relative');
  avWrap.appendChild(ring); avWrap.appendChild(av);
  const nm = el('div', 'nm');
  const tk = el('div', 'tk');
  const st = el('div', 'st');
  const row = el('div', 'row');
  const reset = el('button', 'mini'); reset.textContent = '⟲'; reset.title = 'タイマーをリセット';
  const kill = el('button', 'mini'); kill.textContent = '✕'; kill.title = 'スロットから外す';
  const jump = el('button', 'mini'); jump.textContent = '↗︎ タブ'; jump.title = 'タブへジャンプ'; jump.style.display = 'none';
  row.appendChild(reset); row.appendChild(jump); row.appendChild(kill);
  const assign = el('button', 'assign'); assign.textContent = '＋ 割り当てる';
  assign.onclick = openConnect;
  [avWrap, nm, tk, st, row, assign].forEach(n => root.appendChild(n));
  document.getElementById('stage').appendChild(root);
  slotEls[id] = { root, av, ring, nm, tk, st, row, reset, kill, jump, assign };
  return slotEls[id];
}

function renderSlots() {
  [1,2,3,4,5,6].forEach(id => {
    const r = rosterOf(id), s = sessionOfSlot(id), e = ensureSlot(id);
    const look = { id:'slot' + id, color:r.color, body:r.body, deco:r.deco, visor:r.visor, mark:r.mark };
    const avState = s ? (STATUS[s.status] || STATUS.idle).av : 'idle';
    const key = r.color + '|' + avState;
    if (lastAvatar[id] !== key && typeof window.avatarSvg === 'function') {
      e.av.innerHTML = window.avatarSvg(look, avState, 70); lastAvatar[id] = key;
    }

    e.nm.textContent = r.name;
    if (!s) {                                    // 空き：キャラを薄く残す
      e.av.style.opacity = .42;
      e.av.style.animation = 'none';
      e.ring.style.display = 'none';
      e.nm.style.color = '#3F4C61';
      e.tk.textContent = '空き'; e.tk.style.color = '#2F3B4D'; e.tk.style.cursor = 'default'; e.tk.onclick = null;
      e.st.textContent = ''; e.row.style.display = 'none'; e.assign.style.display = '';
      return;
    }
    const st = STATUS[s.status] || STATUS.idle;
    e.av.style.opacity = 1;
    e.av.style.animation = s.status === 'working' ? 'bob .9s ease-in-out infinite' : 'none';
    e.ring.style.display = s.status === 'awaiting-approval' ? '' : 'none';
    e.nm.style.color = '#E6EDF7';
    e.row.style.display = ''; e.assign.style.display = 'none';
    e.kill.onclick = () => clearSession(s.session_id);
    if (s.browser) {                              // ブラウザAI: タイマー無し、タブへジャンプ
      e.reset.style.display = 'none';
      e.jump.style.display = ''; e.jump.onclick = () => jumpToTab(s.url);
    } else {
      e.reset.style.display = ''; e.reset.onclick = () => resetTimer(s.session_id);
      e.jump.style.display = 'none';
    }

    if (editingTask !== s.session_id) {
      e.tk.style.color = r.color; e.tk.style.cursor = 'pointer';
      e.tk.textContent = s.task || '作業名を入力…';
      if (!s.task) e.tk.style.color = '#3F4C61';
      e.tk.onclick = () => startEditTask(s.session_id, e, s.task || '');
    }
    const elapsed = Date.now() - (s.status_changed_at || Date.now());
    let label = st.label, color = st.color;
    if (s.browser) {                              // ブラウザAIは生成中/確認してねの語で
      if (s.status === 'working') { label = '● 生成中'; }
      else if (s.status === 'awaiting-input') { label = '✅ 確認してね'; color = '#FBBF24'; }
      else { label = '🌐 表示中'; }
    }
    e.st.style.color = color;
    e.st.textContent = `${label} ${fmt(elapsed)}`;
  });
}

function startEditTask(sid, e, cur) {
  editingTask = sid;
  const input = el('input', 'taskin'); input.value = cur; input.placeholder = '作業名を入力';
  e.tk.replaceWith(input); input.focus(); input.select();
  const done = save => {
    editingTask = null;
    const tk = el('div', 'tk'); input.replaceWith(tk); e.tk = tk;
    if (save) saveTask(sid, input.value); else render();
  };
  // IME 変換確定の Enter は保存しない（日本語入力の二重確定防止）
  input.onkeydown = ev => { if (ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229) done(true); else if (ev.key === 'Escape') done(false); };
  input.onblur = () => { if (editingTask === sid) done(true); };
}

/* ---------- 吹き出し（判断待ち／入力待ち） ---------- */
function renderBubbles() {
  document.querySelectorAll('.bubble').forEach(n => n.remove());
  const stage = document.getElementById('stage');
  const shown = new Set();

  Object.values(state.sessions || {}).forEach(s => {
    const a = approvalOfSession(s.session_id);
    const r = rosterOf(s.slot_id);
    const p = slotPos(s.slot_id);
    const right = p.x > CX;
    if (a) {
      shown.add(a.id);
      const b = el('div', 'bubble appr', `${right ? 'left:' + Math.min(700, p.x + 90) + 'px' : 'left:' + Math.max(8, p.x - 390) + 'px'};top:${Math.max(4, p.y - 70)}px`);
      b.innerHTML = `<h4>${esc(r.name)}が判断を待っています 🔧 ${esc(a.tool_name || '')}</h4>
        <div class="cmd">${esc(cmdOf(a))}</div>
        <div class="bb"><button class="allow">✓ 許可</button><button class="deny">✕ 拒否</button></div>
        <button class="more">詳細を見る ›</button>`;
      b.querySelector('.allow').onclick = () => decide(a.id, 'allow');
      b.querySelector('.deny').onclick = () => decide(a.id, 'deny');
      b.querySelector('.more').onclick = () => openDetail(a.id);
      stage.appendChild(b);
    } else if (s.status === 'awaiting-input') {
      const b = el('div', 'bubble inp', `${right ? 'left:' + Math.min(730, p.x + 90) + 'px' : 'left:' + Math.max(8, p.x - 360) + 'px'};top:${Math.max(4, p.y - 40)}px`);
      const head = s.browser ? `${esc(r.name)}の回答が完了！確認してね 👀` : `${esc(r.name)}が入力を待ってます 💬`;
      const body = s.browser ? 'ブラウザのタブで確認できます' : `${esc(s.detail || '入力待ち')}<span style="animation:caret 1s step-end infinite">_</span>`;
      b.innerHTML = `<h4>${head}</h4><div class="cmd">${body}</div>`;
      stage.appendChild(b);
    }
  });

  // スロットに紐づかない承認はステージ上部にフォールバック表示
  Object.values(state.pendingApprovals || {}).filter(a => !shown.has(a.id)).forEach((a, i) => {
    const b = el('div', 'bubble appr', `left:${350 + i * 24}px;top:${8 + i * 20}px`);
    b.innerHTML = `<h4>判断待ち 🔧 ${esc(a.tool_name || '')}</h4>
      <div class="cmd">${esc(cmdOf(a))}</div>
      <div class="bb"><button class="allow">✓ 許可</button><button class="deny">✕ 拒否</button></div>`;
    b.querySelector('.allow').onclick = () => decide(a.id, 'allow');
    b.querySelector('.deny').onclick = () => decide(a.id, 'deny');
    document.getElementById('stage').appendChild(b);
  });
}

/* ---------- ヘッダーのカウント・キュー ---------- */
function renderCounts() {
  const c = { working:0, 'awaiting-approval':0, 'awaiting-input':0, idle:0, done:0, error:0 };
  Object.values(state.sessions || {}).forEach(s => { if (c[s.status] != null) c[s.status]++; });
  const empty = 6 - Object.values(state.sessions || {}).length;
  document.getElementById('counts').innerHTML =
    `<span style="color:#34D399">●${c.working}</span>
     <span style="color:#FBBF24">◉${c['awaiting-approval']}</span>
     <span style="color:#60A5FA">◐${c['awaiting-input']}</span>
     <span style="color:#8494AC">○${c.idle + c.done}</span>
     <span style="color:#3F4C61">空き${Math.max(0, empty)}</span>`;
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('ja-JP');
}
function renderQueue() {
  const q = state.queue || [], box = document.getElementById('queue');
  box.innerHTML = q.length
    ? q.map((it, i) => `<div class="chip">#${i + 1} ${esc(it.cwd ? it.cwd.split('/').pop() : 'unknown')} · ${esc((it.session_id || '').substring(0, 8))}</div>`).join('')
    : '<div class="chip">空</div>';
}

function render() {
  renderWires(); renderSlots(); renderBubbles(); renderCounts(); renderQueue();
}

/* ---------- API ---------- */
async function decide(id, decision) {
  try { await fetch(`${API}/api/approvals/${id}/decision`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ decision, reason:'' }) }); }
  catch (e) { console.error(e); }
}
async function resetTimer(sid) {
  try { await fetch(`${API}/api/sessions/${sid}/reset-timer`, { method:'POST' }); } catch (e) { console.error(e); }
}
async function saveTask(sid, task) {
  try { await fetch(`${API}/api/sessions/${sid}/task`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ task }) }); }
  catch (e) { console.error(e); }
  render();
}
async function clearSession(sid) {
  try { await fetch(`${API}/api/sessions/${sid}`, { method:'DELETE' }); } catch (e) { console.error(e); }
  render();
}
async function clearAll() {
  try { await fetch(`${API}/api/sessions/clear`, { method:'POST' }); } catch (e) { console.error(e); }
  render();
}
async function jumpToTab(url) {
  if (!url) return;
  try { await fetch(`${API}/api/tabs/activate`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ url }) }); }
  catch (e) { console.error(e); }
}

/* ---------- 接続モーダル ---------- */
function openConnect() { document.getElementById('connectModal').classList.add('open'); refreshDiscover(); }
function closeConnect() { document.getElementById('connectModal').classList.remove('open'); }
async function refreshDiscover() {
  const list = document.getElementById('discoverList');
  list.innerHTML = '<div class="hint" style="text-align:center">読み込み中...</div>';
  try {
    const res = await fetch(`${API}/api/discover`);
    const data = await res.json();
    discovered = data.sessions || [];
    const tabs = data.tabs || [];
    if (!discovered.length && !tabs.length) { list.innerHTML = '<div class="hint" style="text-align:center">稼働中の AI が見つかりません</div>'; return; }
    const procHtml = discovered.map((s, i) => `
      <div class="item">
        <div>
          <div class="p">📁 ${esc(s.project)}</div>
          <div class="m">PID ${esc(String(s.pid))}${s.started ? ' · ' + esc(s.started) : ''}</div>
        </div>
        ${s.connected ? '<span class="m">接続済み</span>' : `<button class="btn" data-i="${i}">接続</button>`}
      </div>`).join('');
    const tabHtml = tabs.map((t, i) => `
      <div class="item">
        <div style="min-width:0;">
          <div class="p">🌐 ${esc(t.project)}</div>
          <div class="m" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;">${esc(t.ai_name)} · ${esc(t.url)}</div>
        </div>
        ${t.connected ? '<span class="m">接続済み</span>' : `<button class="btn" data-t="${i}">接続</button>`}
      </div>`).join('');
    list.innerHTML =
      (procHtml ? `<div class="hint">🖥 ネイティブ（Claude Code等・ライブ連携）</div>${procHtml}` : '') +
      (tabHtml ? `<div class="hint" style="margin-top:12px">🌐 ブラウザのAI（存在表示・生成検知）</div>${tabHtml}` : '');
    list.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => connectDiscovered(discovered[+b.dataset.i]));
    list.querySelectorAll('button[data-t]').forEach(b => b.onclick = () => connectTab(tabs[+b.dataset.t]));
  } catch (e) {
    list.innerHTML = '<div class="hint" style="text-align:center;color:#FCA5A5">検知に失敗しました</div>';
  }
}
async function connectDiscovered(s) {
  if (!s) return;
  try {
    await fetch(`${API}/api/events`, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({
        adapter:'discovered', session_id:s.session_id, cwd:s.cwd || ('/' + s.project),
        kind:'start', model_name:s.ai_name || 'AI', detail:'接続しました', ts:Math.floor(Date.now() / 1000)
      })
    });
    refreshDiscover(); render();
  } catch (e) { console.error(e); }
}
async function connectTab(t) {
  if (!t) return;
  try {
    await fetch(`${API}/api/events`, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({
        adapter:'browser', session_id:t.session_id, cwd:t.url, url:t.url,
        kind:'start', model_name:t.ai_name || 'AI', detail:'ブラウザで開いています', ts:Math.floor(Date.now() / 1000)
      })
    });
    refreshDiscover(); render();
  } catch (e) { console.error(e); }
}

/* ---------- 詳細モーダル ---------- */
function openDetail(id) {
  const a = (state.pendingApprovals || {})[id];
  if (!a) return;
  const s = state.sessions[a.card_session_id] || state.sessions[a.session_id] || {};
  const r = rosterOf(s.slot_id);
  document.getElementById('detailTitle').textContent = `${r.name || 'AI'} の判断待ち`;
  document.getElementById('detailBody').innerHTML = `
    <div class="drow"><div class="dlabel">キャラクター / AI</div><div class="dval">${esc(r.name || '-')}${s.model_name ? ' · ' + esc(s.model_name) : ''}</div></div>
    <div class="drow"><div class="dlabel">ツール</div><div class="dval">🔧 ${esc(a.tool_name || '-')}</div></div>
    <div class="drow"><div class="dlabel">内容</div><div class="dval">${esc(cmdOf(a))}</div></div>
    <div class="drow"><div class="dlabel">作業ディレクトリ</div><div class="dval">${esc(a.cwd || s.cwd || '-')}</div></div>
    <div class="drow"><div class="dlabel">経過</div><div class="dval">⏱️ ${fmt(Date.now() - (a.created_at || Date.now()))}</div></div>`;
  const act = document.getElementById('detailActions');
  act.innerHTML = '<button class="allow">✓ 許可</button><button class="deny">✕ 拒否</button>';
  act.querySelector('.allow').onclick = () => { decide(a.id, 'allow'); closeDetail(); };
  act.querySelector('.deny').onclick = () => { decide(a.id, 'deny'); closeDetail(); };
  document.getElementById('detailModal').classList.add('open');
}
function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

/* ---------- WebSocket ---------- */
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    const c = document.getElementById('conn');
    c.textContent = '● 接続中'; c.className = 'conn mono';
  };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'initial_state' || msg.type === 'state_update') {
      const before = activeSources().length;
      state = msg.data;
      if (editingTask === null) render();
      if (before === 0 && activeSources().length > 0) fireBeams();
    }
  };
  ws.onclose = () => {
    const c = document.getElementById('conn');
    c.textContent = '接続なし'; c.className = 'conn off mono';
    setTimeout(connectWS, 3000);
  };
  ws.onerror = e => console.error('WebSocket error', e);
}

/* ---------- 起動 ---------- */
function fitShell() {
  const s = Math.min(1, (window.innerWidth - 40) / 1060);
  document.getElementById('shell').style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitShell);

renderCore();
render();
fitShell();
connectWS();
setInterval(() => { if (editingTask === null) { renderSlots(); renderCounts(); } }, 1000);  // 経過時間だけ更新（光線は再生成しない）
setInterval(fireBeams, 9600);                                                              // 光線のルート・色・タイミングを引き直す
fireBeams();
</script>
